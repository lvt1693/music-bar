{# What search engines read about the app (schema.org SoftwareApplication). Data, not a script: nothing runs. #}
{%- set rel_version = release.version if release else "1.8.0" -%}
<script type="application/ld+json">{{ {
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "MusicBar",
  "description": t("meta_desc"),
  "url": site + "/",
  "downloadUrl": site + "/download",
  "image": site + "/static/img/og-" + lang + ".jpg",
  "operatingSystem": "Windows 10, Windows 11",
  "applicationCategory": "MultimediaApplication",
  "softwareVersion": rel_version,
  "inLanguage": ["vi", "en"],
  "isAccessibleForFree": true,
  "license": "https://opensource.org/licenses/MIT",
  "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"},
  "author": {"@type": "Person", "name": "Truc", "url": "https://github.com/lvt1693"},
  "sameAs": [github]
} | tojson }}</script>
